name: Crear APK de Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Locate Android project & Gradle version
        id: locate
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            HAS_GRADLEW="true"
          else
            SETTINGS_PATH=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            else
              PROJECT_DIR="."
            fi
            HAS_GRADLEW="false"
          fi

          WRAPPER_PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            DETECTED_VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' "$WRAPPER_PROPS" | head -n 1 | sed 's/gradle-//')
          fi
          GRADLE_VER="${DETECTED_VER:-9.3.1}"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "has_gradlew=$HAS_GRADLEW" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$GRADLE_VER" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR | gradlew: $HAS_GRADLEW | Gradle: $GRADLE_VER"

      - name: Setup Gradle (Wrapper)
        if: steps.locate.outputs.has_gradlew == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle (Fallback)
        if: steps.locate.outputs.has_gradlew != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.locate.outputs.gradle_version }}

      - name: Create .env if missing
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ ! -f .env ]; then touch .env; fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload MagicMusic APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicMusic-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
